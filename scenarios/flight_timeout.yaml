# Real 3-leg route, leg 2 (London -> Berlin, 930km). Flight times out
# and is genuinely still pending - but even at its cheapest plausible
# price (infer_cost's floor for 930km), it can't beat coach's actual
# price. VOI = 0 exactly; the agent correctly declines to wait.
name: flight_timeout
directives:
  - source: stub-flight
    origin: London
    destination: Berlin
    directive: "timeout(3)"

# A flight price stored by an earlier query, on the same leg where the
# live flight source now times out - the realistic UseCached case: the
# source is unreachable and there's a price on file from yesterday.
# 26h is inside MAX_CACHE_AGE_HOURS (72), so it's still offered;
# drift_cached() turns it into an asymmetric £71.40-£78.83 interval
# (cached price as floor, drift as ceiling - fares ratchet upward).
cached:
  - leg: london_berlin
    source: stub-flight
    mode: flight
    price_minor: 7140
    age_hours: 26
